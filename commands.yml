# Website: https://papermc.io/

# Atalhos de comandos em português.
# Documentação: https://docs.papermc.io/paper/reference/commands-configuration/
command-block-overrides: []
ignore-vanilla-permissions: false
aliases:
  logar:
  - login $1-
  registrar:
  - register $1-
  dinheiro:
  - balance $1-
  pagar:
  - pay $1-
  topmoney:
  - balancetop $1-
  # Terrenos (GriefPrevention)
  confiar:
  - trust $1-
  desconfiar:
  - untrust $1-
  confiarbau:
  - containertrust $1-
  confiaracesso:
  - accesstrust $1-
  confiancas:
  - trustlist
  terrenos:
  - claimslist $1-
  abandonarterreno:
  - abandonclaim
  abandonartodos:
  - abandonallclaims $1-
  preso:
  - trapped
  subdividir:
  - subdivideclaims
  # Habilidades (AuraSkills) e sentar/deitar (GSit). Lojas de jogadores: /qs
  habilidades:
  - skills $1-
  sentar:
  - sit
  deitar:
  - lay
