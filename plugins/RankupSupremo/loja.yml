# ==================================================================
#                 RANKUP SUPREMO - LOJA (/loja)
# ==================================================================
# Cada mundo tem a sua loja, porque o dinheiro do Rankup e o da
# Sobrevivência são separados. A primeira tela mostra só as categorias.
#
# Categoria:
#   nome / descricao / icone
#   slot:  posição no menu (opcional)
#   tipo:  vender-minerios = botão que vende os minérios do inventário (só no Rankup)
#
# Itens comuns:
#   material:   item do Minecraft (ex.: OAK_LOG)
#   nome:       opcional. Sem nome, aparece o nome do item no idioma do jogo do jogador
#   quantidade: quantos itens vêm em cada compra/venda
#   compra:     preço para COMPRAR essa quantidade (0 ou sem = não vende)
#   venda:      quanto o jogador RECEBE ao vender essa quantidade (0 ou sem = não compra)
#   (a venda precisa ser menor que a compra, senão vira dinheiro infinito)
#
# Boosters (loja do Rankup):
#   tipo:             booster-venda ou booster-tokens
#   bonus:            0.5 = +50%
#   minutos:          duração
#   custo-percentual: preço = % do custo do próximo rank do jogador (0.10 = 10%)
#   custo-minimo:     preço mínimo
#
# Cliques: esquerdo = comprar | shift + esquerdo = comprar 4x
#          direito = vender   | shift + direito = vender tudo
# Depois de editar: /rankupadmin recarregar
# ==================================================================

rankup:
  titulo: "<dark_gray>Loja do Rankup"
  linhas: 4
  categorias:
    boosters-venda:
      nome: "<gold><bold>Boosters de Venda"
      descricao:
        - "<gray>Aumentam o dinheiro de tudo"
        - "<gray>que você vender por um tempo."
      icone: EXPERIENCE_BOTTLE
      slot: 11
      itens:
        venda-50:
          tipo: booster-venda
          nome: "<gold><bold>Booster de Venda +50%"
          icone: EXPERIENCE_BOTTLE
          bonus: 0.5
          minutos: 15
          custo-percentual: 0.08
          custo-minimo: 300
        venda-100:
          tipo: booster-venda
          nome: "<gold><bold>Booster de Venda +100%"
          icone: GLOW_INK_SAC
          bonus: 1.0
          minutos: 20
          custo-percentual: 0.18
          custo-minimo: 800
        venda-200:
          tipo: booster-venda
          nome: "<gradient:#FFD700:#FF8C00><bold>Booster de Venda +200%</bold></gradient>"
          icone: NETHER_STAR
          bonus: 2.0
          minutos: 15
          custo-percentual: 0.35
          custo-minimo: 2000
    boosters-tokens:
      nome: "<light_purple><bold>Boosters de Tokens"
      descricao:
        - "<gray>Aumentam a chance de ganhar"
        - "<gray>tokens minerando."
      icone: AMETHYST_SHARD
      slot: 13
      itens:
        tokens-50:
          tipo: booster-tokens
          nome: "<light_purple><bold>Booster de Tokens +50%"
          icone: AMETHYST_SHARD
          bonus: 0.5
          minutos: 15
          custo-percentual: 0.10
          custo-minimo: 500
        tokens-100:
          tipo: booster-tokens
          nome: "<light_purple><bold>Booster de Tokens +100%"
          icone: AMETHYST_CLUSTER
          bonus: 1.0
          minutos: 20
          custo-percentual: 0.22
          custo-minimo: 1200
    vender:
      nome: "<green><bold>Vender Minérios"
      descricao:
        - "<gray>Vende todos os minérios"
        - "<gray>do seu inventário (igual ao /vender)."
      icone: HOPPER
      slot: 15
      tipo: vender-minerios

