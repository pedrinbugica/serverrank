# ==================================================================
#                    RANKUP SUPREMO - MINAS
# ==================================================================
# Cada mina é construída AUTOMATICAMENTE no mundo na primeira vez que o servidor liga.
#   nome:              nome exibido (MiniMessage)
#   rank:              rank necessário (id do ranks.yml). Ranks maiores também acessam.
#   icone:             item do menu /minas
#   tamanho:           largura da mina (ímpar, entre 7 e 61)
#   profundidade:      altura da mina (3 a 80)
#   reset-minutos:     reset automático a cada X minutos
#   reset-porcentagem: também reseta quando restar X% dos blocos (30 = quando 70% foi minerado; 0 = desativado)
#   parede / detalhe:  blocos da estrutura
#   blocos:            BLOCO: peso (chance relativa)
#
# Minas especiais (opcional):
#   tipo:                 NORMAL, VIP, PVP ou PRESTIGIO
#   tema:                 PADRAO, CRISTAL, DESERTO, CEU, PVP ou PRESTIGIO (decoração da mina)
#   permissao / cargo:    permissão exigida e o nome do cargo mostrado (ex.: rankupsupremo.mina.vip / VIP)
#   prestigio-minimo:     prestígio necessário
#   drops-rank:           em vez dos blocos da mina, dá os minérios da mina do rank do jogador + N
#   multiplicador-tokens: multiplica a chance de ganhar tokens
#   largura-plataforma:   largura da plataforma em volta (3 a 12)
#
# Mudou tamanho/profundidade/parede de uma mina já construída?
#   Use /rankupadmin reconstruir <mina>
# Os preços de venda ficam em vendas.yml.
# ==================================================================

