# Administração
admin-ajuda:
- ''
- <gold><bold>  RankUP Supremo - Admin</bold>
- <yellow>  /rankupadmin recarregar <gray>- recarrega as configs
- <yellow>  /rankupadmin setrank <jogador> <rank> <gray>- define o rank
- <yellow>  /rankupadmin setprestigio <jogador> <n> <gray>- define o prestígio
- <yellow>  /rankupadmin darpicareta [jogador] <gray>- dá uma picareta nova
- <yellow>  /rankupadmin setpicareta <melhoria> <nivel> <gray>- define nível da picareta
  na mão
- <yellow>  /rankupadmin tokens <jogador> <dar|tirar|definir> <qtd> <gray>- tokens
  de mina
- <yellow>  /rankupadmin resetarmina <mina|todas> <gray>- reseta minas
- <yellow>  /rankupadmin reconstruir <mina|spawn> <gray>- reconstrói estruturas
- <yellow>  /rankupadmin setspawn <gray>- define o spawn na sua posição
- <yellow>  /rankupadmin construir <gray>- liga/desliga o modo construção
- <yellow>  /rankupadmin info <jogador> <gray>- informações do jogador
- <yellow>  /menuop [jogador] <gray>- painel do dono (dinheiro, picaretas OP...)
- ''
