  ResizeClaimTooNarrow:
    Text: Esse novo tamanho seria pequeno demais. Terrenos devem ter pelo menos {0}
      blocos de largura.
    Notes: '0: minimum claim width'
  ResizeClaimInsufficientArea:
    Text: Este terreno ficaria pequeno demais. Todo terreno deve usar pelo menos {0}
      blocos.
    Notes: '0: minimum claim area'
  NoProfanity:
    Text: Por favor, modere sua linguagem.
  PlayerNotIgnorable:
    Text: Você não pode ignorar esse jogador.
  NoEnoughBlocksForChestClaim:
    Text: Como você não tem blocos de terreno disponíveis, nenhuma proteção automática
      foi criada. Use /terrenos para ver seus blocos.
  IsIgnoringYou:
    Text: Esse jogador está te ignorando.
  MustHoldModificationToolForThat:
    Text: Você precisa estar segurando uma pá de ouro para fazer isso.
  StandInClaimToResize:
    Text: Fique dentro do terreno que você quer redimensionar.
  ClaimsExtendToSky:
    Text: Os terrenos sempre vão até o limite de altura do mundo.
  ClaimsAutoExtendDownward:
    Text: Os terrenos descem automaticamente quando você coloca blocos mais fundo.
  MinimumRadius:
    Text: O raio mínimo é {0}.
    Notes: '0: minimum radius'
  ClaimTooSmallForActiveBlocks:
    Text: Este terreno não é grande o suficiente para blocos ativos (funis, spawners,
      sinalizadores...). Aumente o terreno primeiro.
  TooManyActiveBlocksInClaim:
    Text: Este terreno atingiu o limite de blocos ativos (funis, spawners, sinalizadores...).
      Aumente o terreno ou remova outros blocos ativos.
  ConsoleOnlyCommand:
    Text: Esse comando só pode ser usado no console do servidor.
  WorldNotFound:
    Text: Mundo não encontrado.
  AdjustBlocksAllSuccess:
    Text: Blocos bônus de todos os jogadores online ajustados em {0}.
    Notes: '0: adjustment amount'
  TooMuchIpOverlap:
    Text: Desculpe, há jogadores demais conectados com o seu endereço de IP.
  StandInSubclaim:
    Text: Você precisa estar dentro de uma subdivisão para restringi-la
  SubclaimRestricted:
    Text: As permissões desta subdivisão não serão mais herdadas do terreno principal
  SubclaimUnrestricted:
    Text: As permissões desta subdivisão agora são herdadas do terreno principal
  NetherPortalTrapDetectionMessage:
    Text: Parece que você ficou preso dentro de um portal do Nether. Vamos te resgatar
      em alguns segundos, se for o caso!
    Notes: Sent to player on join, if they left while inside a nether portal.
