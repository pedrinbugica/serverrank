# ==================================================================
#                 NPCs VIVOS - MENSAGENS
# ==================================================================
prefixo: <dark_gray>[<gold>NPC</gold>] <reset>

fala: '{npc} <dark_gray>» <white>{fala}'
clique-de-novo: <gray>(Clique em {npc} <gray>de novo para continuar a conversa.)
sem-permissao: <red>Você não tem permissão para isso.
economia-indisponivel: <red>A economia está indisponível no momento. Avise a staff!
erro-transacao: <red>Não foi possível concluir a transação. Tente de novo.
longe-do-npc: <red>Você se afastou de {npc}<red>.

# Loja
loja-titulo-comprar: <dark_gray>{npc} » Comprar
loja-titulo-vender: <dark_gray>{npc} » Vender
comprou: <green>Você comprou <white>{quantidade}x {item} <green>por <white>${preco}<green>.
vendeu: <green>Você vendeu <white>{quantidade}x {item} <green>por <white>${valor}<green>.
sem-dinheiro: <red>Você não tem dinheiro suficiente (precisa de <white>${preco}<red>).
sem-estoque: <red>Esse item acabou! Ele volta aos poucos com o tempo.
sem-espaco: <red>Seu inventário não tem espaço.
sem-itens: <red>Você precisa de pelo menos <white>{quantidade}x {item}<red>.
limite-diario: <red>{npc} <red>já comprou tudo o que podia de você hoje. Volte amanhã!
consertou: <green>{npc} <green>consertou seu item por <white>${preco}<green>.
nada-para-consertar: <red>Segure na mão um item gasto (ferramenta, arma ou armadura).

# Administração (/npcv)
ajuda:
- ''
- <gold><bold>  NPCs Vivos - Comandos</bold>
- <yellow>  /npcv criar <papel> <id> [nome] <gray>- cria um NPC onde você está
- <yellow>  /npcv remover <id> <gray>- apaga o NPC
- <yellow>  /npcv lista <gray>- todos os NPCs
- <yellow>  /npcv info <id> <gray>- informações do NPC
- <yellow>  /npcv mover <id> <gray>- traz o NPC para onde você está
- <yellow>  /npcv tp <id> <gray>- vai até o NPC
- <yellow>  /npcv nome <id> <nome> <gray>- muda o nome (aceita cores)
- <yellow>  /npcv skin <id> <skin> <gray>- steve, alex, zuri... ou jogador:Nick
- <yellow>  /npcv mao <id> <gray>- o NPC segura o item da sua mão
- <yellow>  /npcv papel <id> adicionar|remover <papel>
- <yellow>  /npcv fala <id> adicionar|saudacao|retorno|limpar [texto]
- <yellow>  /npcv loja <id> compra <preço> [estoque] [repõe/hora] <gray>- jogador
  compra o item da sua mão
- <yellow>  /npcv loja <id> venda <preço> [limite/dia] <gray>- jogador vende o item
  da sua mão
- <yellow>  /npcv loja <id> ver|limpar
- <yellow>  /npcv reload <gray>- recarrega os arquivos
- <gray>  Nas falas, {jogador} vira o nome de quem conversa.
- ''
