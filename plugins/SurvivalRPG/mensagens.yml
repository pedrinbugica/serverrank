# Mensagens do SurvivalRPG (MiniMessage: <red>, <bold>, <gradient:...>; & também funciona)
# {chave} é trocado pelo valor. Depois de editar: /rpgadmin reload
prefixo: "<dark_gray>[<gold>RPG<dark_gray>] <reset>"

apenas-jogador: "<red>Só jogadores podem usar isso."
jogador-offline: "<red>Jogador não encontrado (precisa estar online)."
numero-invalido: "<red>Número inválido."
tipo-invalido: "<red>Tipo inválido. Use: capital, vila, taverna, castelo, torre, masmorra, ruina, acampamento."
uso: "<red>Uso: <white>{uso}"
fora-do-rpg: "<red>Isso só funciona no mundo de sobrevivência (RPG). Use <white>/sobrevivencia<red>."
mundo-nao-encontrado: "<red>Mundo <white>{mundo}<red> não está carregado."

ajuda:
  - "<gold><bold>━━━ Como jogar o RPG ━━━"
  - "<yellow>/classe <gray>escolha sua classe (a primeira é grátis)"
  - "<yellow>/rpg <gray>seu personagem: nível, atributos, habilidades, grupo, lugares"
  - "<yellow>/atributos <gray>distribua os pontos que ganha a cada nível"
  - "<gray>Habilidades: com a <white>arma da classe<gray> na mão aperte <white>F<gray>, depois <white>1<gray>, <white>2<gray> ou <white>3"
  - "<gray>Monstros têm <white>nível<gray>: quanto mais longe do spawn, mais fortes (e melhor o loot)"
  - "<gray>Elites <gold>(dourados)<gray> e campeões <light_purple>(brilhando)<gray> derrubam itens raros"
  - "<yellow>/grupo convidar <nick> <gray>jogue junto: sem fogo amigo e +XP"
  - "<yellow>/lugares <gray>vilas, tavernas, castelos e masmorras; viagem rápida entre cidades"
  - "<yellow>Masmorras: <gray>Portão das Masmorras em Vila Aurora (a capital, no spawn)"

perfil-texto:
  - "<gold>━━━ {jogador} ━━━"
  - "<gray>Classe: {classe} <dark_gray>• <gray>Nível: <yellow>{nivel} <dark_gray>• <gray>Lugares: <white>{lugares}"

numeros-ligados: "<green>Números de dano ligados."
numeros-desligados: "<gray>Números de dano desligados."

# ---------------------------------------------------------------- MENUS
menu-perfil-titulo: "<dark_gray>Seu personagem"
menu-classes-titulo: "<dark_gray>Escolha sua classe"
