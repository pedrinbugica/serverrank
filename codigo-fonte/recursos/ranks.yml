# ==================================================================
#                    RANKUP SUPREMO - RANKS
# ==================================================================
# A ordem aqui é a ordem dos ranks (o primeiro é o rank inicial).
#   nome:     nome do rank
#   tag:      tag exibida no chat, TAB e scoreboard
#   custo:    preço para CHEGAR neste rank (o primeiro deve ser 0)
#   icone:    item mostrado no menu /ranks
#   requisitos.blocos: blocos minerados (total da conta) necessários para upar (opcional)
#   comandos: executados pelo console ao chegar no rank ({jogador} {rank})
#             Ex.: "eco give {jogador} 1000" ou "lp user {jogador} permission set essentials.fly true"
#
# O custo real aumenta com o prestígio (veja prestigio.aumento-custo-ranks no config.yml).
# ==================================================================

ranks:
